<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>放課後サバイバー（仮）- Phase1 v2</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1b1d22;
    overflow: hidden;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    user-select: none;
  }
  canvas {
    display: block;
    background: #2b2f36;
    touch-action: none; /* スマホでドラッグ操作した時にページがスクロール/拡大しないようにする */
  }

  /* ---------- スマホ用バーチャルスティック ---------- */
  #joystick-base {
    position: fixed;
    width: 100px;
    height: 100px;
    margin-left: -50px;
    margin-top: -50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35);
    display: none;
    pointer-events: none;
    z-index: 5;
  }
  #joystick-knob {
    position: fixed;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    margin-top: -23px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    display: none;
    pointer-events: none;
    z-index: 6;
  }

  /* ---------- HUD（HP・タイマー・回収数） ---------- */
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #hp-bar-outer {
    width: 220px;
    height: 18px;
    border: 2px solid #fff;
    border-radius: 4px;
    background: rgba(0,0,0,0.4);
    overflow: hidden;
  }
  #hp-bar-inner {
    height: 100%;
    width: 100%;
    background: linear-gradient(#5ee65e, #2fa32f);
    transition: width 0.15s linear;
  }
  #hp-text {
    font-size: 12px;
    margin-top: 2px;
  }
  #collect-status {
    margin-top: 10px;
    font-size: 14px;
    background: rgba(0,0,0,0.35);
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-block;
  }

  #phase-timer {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #phase-timer.warning { color: #ff6b6b; }

  /* ---------- 拾得の短い通知 ---------- */
  #pickup-notice {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translate(-50%, -12px);
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.15s ease-out, transform 0.15s ease-out;
    pointer-events: none;
    white-space: nowrap;
  }
  #pickup-notice.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ---------- フェーズ切り替え用の暗転メッセージ ---------- */
  #phase-banner {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 0.1em;
    z-index: 20;
    pointer-events: none;
  }
  #phase-banner.show { display: flex; }

  /* ---------- 準備フェーズ（HTMLオーバーレイのUI） ---------- */
  #prep-screen {
    position: fixed;
    inset: 0;
    background: rgba(15,17,22,0.96);
    color: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    box-sizing: border-box;
    overflow-y: auto;
    z-index: 30;
  }
  #prep-screen.show { display: flex; }
  #prep-screen h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  #prep-screen .prep-sub {
    font-size: 13px;
    opacity: 0.75;
    margin-bottom: 20px;
    text-align: center;
  }
  .prep-section-title {
    font-size: 14px;
    opacity: 0.8;
    margin: 12px 0 8px;
    align-self: flex-start;
  }

  #loadout-slots {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .loadout-slot {
    width: 84px;
    height: 84px;
    border: 2px dashed rgba(255,255,255,0.35);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 11px;
    text-align: center;
    cursor: pointer;
    background: rgba(255,255,255,0.04);
  }
  .loadout-slot.filled {
    border-style: solid;
    border-color: #ffd23f;
    background: rgba(255,210,63,0.12);
  }
  .loadout-slot .slot-name { font-size: 12px; font-weight: bold; margin-top: 4px; }

  #material-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 640px;
    margin-bottom: 20px;
  }
  .material-card {
    width: 90px;
    padding: 8px 6px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.05);
    text-align: center;
    cursor: pointer;
    font-size: 11px;
  }
  .material-card.selected {
    opacity: 0.35;
    cursor: default;
  }
  .material-card .card-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    margin: 0 auto 6px;
  }
  .material-card .card-name { font-weight: bold; }
  .material-card .card-rank { margin-top: 2px; }
  .rank-low { color: #ccc; }
  .rank-mid { color: #fff; font-weight: bold; }
  .rank-high { color: #6cf0ff; font-weight: bold; }
  .rank-jackpot { color: #ffd23f; font-weight: bold; text-shadow: 0 0 6px #ffb300; }

  #prep-empty-note {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 20px;
  }

  #go-battle-button {
    font-size: 16px;
    padding: 10px 28px;
    border-radius: 24px;
    border: none;
    background: #ffd23f;
    color: #2b2200;
    font-weight: bold;
    cursor: pointer;
  }
  #go-battle-button:disabled {
    background: #555;
    color: #999;
    cursor: not-allowed;
  }

  /* ---------- 戦闘フェーズ（未実装のスタブ画面） ---------- */
  #combat-stub {
    position: fixed;
    inset: 0;
    background: rgba(15,17,22,0.96);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 30;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #combat-stub.show { display: flex; }
  #combat-stub button {
    font-size: 15px;
    padding: 8px 20px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="hp-bar-outer"><div id="hp-bar-inner"></div></div>
  <div id="hp-text">HP 120 / 120</div>
  <div id="collect-status">回収: 0個</div>
</div>

<div id="phase-timer"></div>
<div id="pickup-notice"></div>
<div id="phase-banner"></div>

<div id="prep-screen">
  <h1>準備フェーズ：装備を選ぼう</h1>
  <p class="prep-sub">回収した素材から、戦闘で使う武器を最大3つまで選んでください。<br>質ランクが高いほど強力です。</p>

  <div class="prep-section-title">現在の装備（タップで外す）</div>
  <div id="loadout-slots"></div>

  <div class="prep-section-title">回収した素材（タップで装備）</div>
  <div id="material-pool"></div>
  <div id="prep-empty-note" style="display:none;">回収した素材がありません。素手のまま出撃することになります。</div>

  <button id="go-battle-button">出撃する</button>
</div>

<div id="combat-stub">
  <h2>ここまで実装できました！</h2>
  <p id="combat-stub-loadout"></p>
  <p style="font-size:13px; opacity:0.7; max-width:480px;">
    戦闘フェーズ（サバイバーライク本編）と、道中で拾う「遺物」システムは次のステップで実装します。
  </p>
  <button id="restart-run-button">回収フェーズからやり直す</button>
</div>

<canvas id="game"></canvas>
<div id="joystick-base"></div>
<div id="joystick-knob"></div>

<script>
"use strict";

// ======================================================================
// 放課後サバイバー Phase1 v2
// 1回のプレイ = 「回収フェーズ → 準備フェーズ → 戦闘フェーズ」の3部構成
//   ・回収フェーズ：制限時間内に素材を拾い集める。徘徊する敵に触れるとダメージ
//     （このダメージは戦闘フェーズまで持ち越し）
//   ・準備フェーズ：集めた素材から、装備する武器を最大3つ選ぶ
//   ・戦闘フェーズ：今回はまだ未実装（次のステップ）。選んだ装備の確認画面のみ
// ======================================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ----------------------------------------------------------------------
// 当たり判定ユーティリティ：全部「中心座標＋半径」の円判定だけを使う
// ----------------------------------------------------------------------
function circlesOverlap(ax, ay, ar, bx, by, br) {
  const dx = ax - bx;
  const dy = ay - by;
  const distSq = dx * dx + dy * dy;
  const rr = ar + br;
  return distSq <= rr * rr;
}
function dist(ax, ay, bx, by) {
  return Math.hypot(ax - bx, ay - by);
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// ----------------------------------------------------------------------
// 素材データ（フェーズ1で使う4種のみ）
// quality_table は「発生した瞬間」に1回だけ抽選するために使う
// ----------------------------------------------------------------------
const MATERIALS = {
  ballpoint_pen: {
    id: "ballpoint_pen", name: "ボールペン", weaponType: "sword", qualityType: "stable",
    qualityTable: [
      { rank: "low", chance: 0.15, multiplier: 0.7 },
      { rank: "mid", chance: 0.70, multiplier: 1.0 },
      { rank: "high", chance: 0.15, multiplier: 1.4 },
    ],
    basePower: 10, jackpotEffect: "small_area_ink_splash", color: "#4d8dff",
  },
  protractor: {
    id: "protractor", name: "分度器", weaponType: "shield", qualityType: "stable",
    qualityTable: [
      { rank: "low", chance: 0.15, multiplier: 0.7 },
      { rank: "mid", chance: 0.70, multiplier: 1.0 },
      { rank: "high", chance: 0.15, multiplier: 1.4 },
    ],
    basePower: 8, jackpotEffect: "reflect_area_expand", color: "#ffb84d",
  },
  chalk: {
    id: "chalk", name: "チョーク", weaponType: "thrown", qualityType: "romance",
    qualityTable: [
      { rank: "low", chance: 0.90, multiplier: 0.5 },
      { rank: "mid", chance: 0.09, multiplier: 1.5 },
      { rank: "jackpot", chance: 0.01, multiplier: 3.0 },
    ],
    basePower: 4, jackpotEffect: "smoke_field_debuff", color: "#f5f5f5",
  },
  weed_from_windowsill: {
    id: "weed_from_windowsill", name: "窓際の雑草", weaponType: "thrown", qualityType: "romance",
    qualityTable: [
      { rank: "low", chance: 0.90, multiplier: 0.4 },
      { rank: "mid", chance: 0.09, multiplier: 1.4 },
      { rank: "jackpot", chance: 0.01, multiplier: 3.5 },
    ],
    basePower: 3, jackpotEffect: "pollen_debuff_field", color: "#5ec95e",
  },
};
const MATERIAL_IDS = Object.keys(MATERIALS);
const RANK_LABEL = { low: "low", mid: "mid", high: "HIGH", jackpot: "JACKPOT!!" };

// 質ランクを1回だけ抽選する（＝素材が世界に発生した瞬間に呼ぶ）
function rollQuality(material) {
  const r = Math.random();
  let acc = 0;
  for (const entry of material.qualityTable) {
    acc += entry.chance;
    if (r < acc) return entry;
  }
  return material.qualityTable[material.qualityTable.length - 1];
}

// 装備武器データに変換（質ランクは既に決まっている前提。ここでは抽選しない）
function toEquippedWeapon(pickedItem) {
  const mat = MATERIALS[pickedItem.materialId];
  const cooldownByType = { sword: 450, shield: 900, thrown: 650 };
  const rangeByType = { sword: 60, shield: 78, thrown: 230 };
  return {
    materialId: mat.id,
    name: mat.name,
    weaponType: mat.weaponType,
    rank: pickedItem.rank,
    multiplier: pickedItem.multiplier,
    basePower: mat.basePower,
    cooldownMs: cooldownByType[mat.weaponType],
    range: rangeByType[mat.weaponType],
    jackpotEffect: pickedItem.rank === "jackpot" ? mat.jackpotEffect : null,
    color: mat.color,
  };
}

// ----------------------------------------------------------------------
// プレイヤー（HPは回収フェーズ→戦闘フェーズを通して共通で持ち越す）
// ----------------------------------------------------------------------
const player = {
  x: 0, y: 0,
  r: 16,
  speed: 220,
  color: "#ffcc00",
  hp: 120,
  maxHp: 120,
  invincibleUntil: 0,
  invincibleMs: 700,
  facingX: 0, facingY: -1,
};

function resetRun() {
  player.hp = player.maxHp;
  player.invincibleUntil = 0;
  collectedMaterials.length = 0;
  loadout.length = 0;
}

// ----------------------------------------------------------------------
// 入力（キーボード）
// ----------------------------------------------------------------------
const keys = {};
window.addEventListener("keydown", (ev) => { keys[ev.key.toLowerCase()] = true; });
window.addEventListener("keyup", (ev) => { keys[ev.key.toLowerCase()] = false; });

function readMoveVector() {
  let mx = 0, my = 0;
  if (keys["w"] || keys["arrowup"]) my -= 1;
  if (keys["s"] || keys["arrowdown"]) my += 1;
  if (keys["a"] || keys["arrowleft"]) mx -= 1;
  if (keys["d"] || keys["arrowright"]) mx += 1;

  if (joystick.active) {
    mx = joystick.vx;
    my = joystick.vy;
  }

  if (mx !== 0 || my !== 0) {
    const len = Math.hypot(mx, my);
    mx /= len; my /= len;
  }
  return { mx, my };
}

// ----------------------------------------------------------------------
// スマホ向けタッチ操作（バーチャルスティック）
// ----------------------------------------------------------------------
if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
  document.documentElement.classList.add("is-touch");
}
const joystickBaseEl = document.getElementById("joystick-base");
const joystickKnobEl = document.getElementById("joystick-knob");
const JOYSTICK_MAX_RADIUS = 50;
const joystick = { active: false, touchId: null, originX: 0, originY: 0, vx: 0, vy: 0 };

function joystickStart(x, y, touchId) {
  joystick.active = true;
  joystick.touchId = touchId;
  joystick.originX = x;
  joystick.originY = y;
  joystick.vx = 0;
  joystick.vy = 0;
  joystickBaseEl.style.left = x + "px";
  joystickBaseEl.style.top = y + "px";
  joystickBaseEl.style.display = "block";
  joystickKnobEl.style.left = x + "px";
  joystickKnobEl.style.top = y + "px";
  joystickKnobEl.style.display = "block";
}
function joystickMove(x, y) {
  if (!joystick.active) return;
  let dx = x - joystick.originX;
  let dy = y - joystick.originY;
  const d = Math.hypot(dx, dy);
  if (d > JOYSTICK_MAX_RADIUS) {
    dx = (dx / d) * JOYSTICK_MAX_RADIUS;
    dy = (dy / d) * JOYSTICK_MAX_RADIUS;
  }
  joystickKnobEl.style.left = (joystick.originX + dx) + "px";
  joystickKnobEl.style.top = (joystick.originY + dy) + "px";
  if (d < 6) { joystick.vx = 0; joystick.vy = 0; }
  else { joystick.vx = dx / JOYSTICK_MAX_RADIUS; joystick.vy = dy / JOYSTICK_MAX_RADIUS; }
}
function joystickEnd() {
  joystick.active = false;
  joystick.touchId = null;
  joystick.vx = 0; joystick.vy = 0;
  joystickBaseEl.style.display = "none";
  joystickKnobEl.style.display = "none";
}
canvas.addEventListener("touchstart", (ev) => {
  if (joystick.active) return;
  const t = ev.changedTouches[0];
  joystickStart(t.clientX, t.clientY, t.identifier);
  ev.preventDefault();
}, { passive: false });
canvas.addEventListener("touchmove", (ev) => {
  for (const t of ev.changedTouches) {
    if (t.identifier === joystick.touchId) joystickMove(t.clientX, t.clientY);
  }
  ev.preventDefault();
}, { passive: false });
function handleTouchEnd(ev) {
  for (const t of ev.changedTouches) {
    if (t.identifier === joystick.touchId) joystickEnd();
  }
}
canvas.addEventListener("touchend", handleTouchEnd);
canvas.addEventListener("touchcancel", handleTouchEnd);

// ----------------------------------------------------------------------
// 演出まわり（拾得通知・フローティングテキストなど）
// ----------------------------------------------------------------------
const noticeEl = document.getElementById("pickup-notice");
let noticeTimer = null;
function showNotice(text) {
  noticeEl.textContent = text;
  noticeEl.classList.remove("show");
  void noticeEl.offsetWidth;
  noticeEl.classList.add("show");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => noticeEl.classList.remove("show"), 800);
}

const floatingTexts = [];
function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, bornAt: performance.now(), lifeMs: 600 });
}

function drawAuraRing(x, y, r, strokeStyle, lineWidth) {
  ctx.beginPath();
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = lineWidth;
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
}

// ======================================================================
// フェーズ管理
// ======================================================================
const PHASE = { COLLECT: "collect", PREP: "prep", COMBAT_STUB: "combat_stub" };
let phase = PHASE.COLLECT;

const phaseBannerEl = document.getElementById("phase-banner");
function flashPhaseBanner(text, durationMs) {
  phaseBannerEl.textContent = text;
  phaseBannerEl.classList.add("show");
  setTimeout(() => phaseBannerEl.classList.remove("show"), durationMs);
}

// ======================================================================
// ① 回収フェーズ
// ======================================================================
const COLLECT_DURATION_MS = 45000;
const COLLECT_MATERIAL_COUNT = 10; // 制限時間内に全部は拾いきれない数を意図的にばらまく

let collectTimeLeftMs = COLLECT_DURATION_MS;
const materialsOnField = []; // {x,y,r,materialId,rank,multiplier}
const collectedMaterials = []; // 回収済み(まだ武器になっていない)素材。準備フェーズで使う
const hazards = []; // 回収フェーズを徘徊する敵（ゾンビ化した生徒）

function spawnHazard() {
  const margin = 40;
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = -margin; y = Math.random() * canvas.height; }
  else if (side === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
  else if (side === 2) { x = Math.random() * canvas.width; y = -margin; }
  else { x = Math.random() * canvas.width; y = canvas.height + margin; }
  hazards.push({ x, y, r: 15, speed: 70, contactDamage: 10 });
}

function scatterCollectMaterials() {
  materialsOnField.length = 0;
  const margin = 60;
  for (let i = 0; i < COLLECT_MATERIAL_COUNT; i++) {
    const id = MATERIAL_IDS[Math.floor(Math.random() * MATERIAL_IDS.length)];
    const mat = MATERIALS[id];
    const rolled = rollQuality(mat); // 発生した瞬間の1回きりの抽選
    materialsOnField.push({
      x: margin + Math.random() * (canvas.width - margin * 2),
      y: margin + Math.random() * (canvas.height - margin * 2),
      r: 10,
      materialId: id,
      rank: rolled.rank,
      multiplier: rolled.multiplier,
    });
  }
}

function startCollectPhase() {
  phase = PHASE.COLLECT;
  resetRun();
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  collectTimeLeftMs = COLLECT_DURATION_MS;
  hazards.length = 0;
  spawnHazard();
  scatterCollectMaterials();
  document.getElementById("prep-screen").classList.remove("show");
  document.getElementById("combat-stub").classList.remove("show");
  flashPhaseBanner("回収フェーズ開始！", 1200);
}

function updateHazard(h, dt) {
  const dx = player.x - h.x, dy = player.y - h.y;
  const d = Math.hypot(dx, dy) || 1;
  h.x += (dx / d) * h.speed * dt;
  h.y += (dy / d) * h.speed * dt;
}

function updateCollectPhase(dt, now) {
  collectTimeLeftMs -= dt * 1000;

  // 20秒経過時点で2体目の徘徊敵を追加し、後半は少し忙しくする
  if (collectTimeLeftMs <= COLLECT_DURATION_MS - 20000 && hazards.length < 2) {
    spawnHazard();
  }

  const { mx, my } = readMoveVector();
  if (mx !== 0 || my !== 0) { player.facingX = mx; player.facingY = my; }
  player.x = clamp(player.x + mx * player.speed * dt, player.r, canvas.width - player.r);
  player.y = clamp(player.y + my * player.speed * dt, player.r, canvas.height - player.r);

  for (const h of hazards) {
    updateHazard(h, dt);
    if (circlesOverlap(player.x, player.y, player.r, h.x, h.y, h.r) && now >= player.invincibleUntil) {
      player.hp = Math.max(0, player.hp - h.contactDamage);
      player.invincibleUntil = now + player.invincibleMs;
      spawnFloatingText(player.x, player.y - player.r - 6, `-${h.contactDamage}`, "#ff6b6b");
    }
  }

  for (let i = materialsOnField.length - 1; i >= 0; i--) {
    const m = materialsOnField[i];
    if (circlesOverlap(player.x, player.y, player.r, m.x, m.y, m.r)) {
      collectedMaterials.push({ materialId: m.materialId, rank: m.rank, multiplier: m.multiplier });
      showNotice(`${MATERIALS[m.materialId].name}を回収した`);
      materialsOnField.splice(i, 1);
    }
  }

  updateCollectHud();

  if (collectTimeLeftMs <= 0 || player.hp <= 0) {
    enterPrepPhase();
  }
}

function drawCollectPhase(now) {
  drawFloorGrid();
  for (const m of materialsOnField) drawFieldMaterial(m, now);
  for (const h of hazards) drawHazard(h);
  drawPlayer(now);
  drawFloatingTexts(now);
}

function drawHazard(h) {
  ctx.beginPath();
  ctx.fillStyle = "#7fae5b";
  ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
  ctx.fill();
}

// ----------------------------------------------------------------------
// 準備フェーズへの切り替え
// ----------------------------------------------------------------------
const loadout = []; // 装備スロット。最大3、中身は collectedMaterials の要素そのもの

function enterPrepPhase() {
  phase = PHASE.PREP;
  loadout.length = 0;
  document.getElementById("prep-screen").classList.add("show");
  renderPrepScreen();
}

// ======================================================================
// ② 準備フェーズ（HTML UI）
// ======================================================================
const materialPoolEl = document.getElementById("material-pool");
const loadoutSlotsEl = document.getElementById("loadout-slots");
const prepEmptyNoteEl = document.getElementById("prep-empty-note");
const goBattleButton = document.getElementById("go-battle-button");

function renderPrepScreen() {
  materialPoolEl.innerHTML = "";
  loadoutSlotsEl.innerHTML = "";

  prepEmptyNoteEl.style.display = collectedMaterials.length === 0 ? "block" : "none";

  // 装備スロット（最大3）
  for (let i = 0; i < 3; i++) {
    const slotDiv = document.createElement("div");
    const item = loadout[i];
    slotDiv.className = "loadout-slot" + (item ? " filled" : "");
    if (item) {
      const mat = MATERIALS[item.materialId];
      slotDiv.innerHTML = `<div class="card-dot" style="background:${mat.color}"></div><div class="slot-name">${mat.name}</div><div class="card-rank rank-${item.rank}">${RANK_LABEL[item.rank]}</div>`;
      slotDiv.addEventListener("click", () => {
        loadout.splice(i, 1);
        renderPrepScreen();
      });
    } else {
      slotDiv.textContent = "空き枠";
      slotDiv.style.opacity = "0.5";
    }
    loadoutSlotsEl.appendChild(slotDiv);
  }

  // 回収した素材一覧（すでに装備枠に入っているものは選択済み表示にする）
  const usedIndices = new Set(loadout.map((it) => it.__poolIndex));
  collectedMaterials.forEach((item, index) => {
    const mat = MATERIALS[item.materialId];
    const card = document.createElement("div");
    const isUsed = usedIndices.has(index);
    card.className = "material-card" + (isUsed ? " selected" : "");
    card.innerHTML = `
      <div class="card-dot" style="background:${mat.color}"></div>
      <div class="card-name">${mat.name}</div>
      <div class="card-rank rank-${item.rank}">${RANK_LABEL[item.rank]}</div>
    `;
    if (!isUsed) {
      card.addEventListener("click", () => {
        if (loadout.length >= 3) return; // 3枠埋まっていたら何もしない
        const tagged = Object.assign({}, item, { __poolIndex: index });
        loadout.push(tagged);
        renderPrepScreen();
      });
    }
    materialPoolEl.appendChild(card);
  });

  goBattleButton.disabled = false; // 0〜3個どの状態でも出撃は可能（0個なら素手扱い）
}

goBattleButton.addEventListener("click", () => {
  enterCombatStub();
});

// ======================================================================
// ③ 戦闘フェーズ（今回はスタブ画面のみ。次のステップで本実装）
// ======================================================================
const combatStubLoadoutEl = document.getElementById("combat-stub-loadout");

function enterCombatStub() {
  phase = PHASE.COMBAT_STUB;
  document.getElementById("prep-screen").classList.remove("show");
  document.getElementById("combat-stub").classList.add("show");

  if (loadout.length === 0) {
    combatStubLoadoutEl.textContent = "選んだ装備: なし（素手で出撃）";
  } else {
    const names = loadout.map((it) => `${MATERIALS[it.materialId].name}[${RANK_LABEL[it.rank]}]`);
    combatStubLoadoutEl.textContent = "選んだ装備: " + names.join(" / ");
  }
}

document.getElementById("restart-run-button").addEventListener("click", () => {
  document.getElementById("combat-stub").classList.remove("show");
  startCollectPhase();
});

// ======================================================================
// HUD更新・描画共通処理
// ======================================================================
const hpBarInner = document.getElementById("hp-bar-inner");
const hpText = document.getElementById("hp-text");
const collectStatusEl = document.getElementById("collect-status");
const phaseTimerEl = document.getElementById("phase-timer");

function updateCollectHud() {
  const hpPct = Math.max(0, (player.hp / player.maxHp) * 100);
  hpBarInner.style.width = hpPct + "%";
  hpText.textContent = `HP ${Math.ceil(player.hp)} / ${player.maxHp}`;
  collectStatusEl.textContent = `回収: ${collectedMaterials.length}個`;

  const secs = Math.max(0, Math.ceil(collectTimeLeftMs / 1000));
  phaseTimerEl.textContent = `残り ${secs} 秒`;
  phaseTimerEl.classList.toggle("warning", secs <= 10);
}

function drawFloorGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.lineWidth = 1;
  const grid = 40;
  for (let x = 0; x < canvas.width; x += grid) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += grid) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function drawPlayer(now) {
  const invincible = now < player.invincibleUntil;
  ctx.beginPath();
  ctx.fillStyle = invincible ? "#fff5b0" : player.color;
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.fillStyle = "#333";
  const fx = player.x + player.facingX * (player.r + 6);
  const fy = player.y + player.facingY * (player.r + 6);
  ctx.arc(fx, fy, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawFieldMaterial(m, now) {
  const mat = MATERIALS[m.materialId];
  const pulse = 0.5 + 0.5 * Math.sin(now / 200);
  if (m.rank === "mid") {
    drawAuraRing(m.x, m.y, m.r + 6, `rgba(255,255,255,${0.25 + 0.15 * pulse})`, 2);
  } else if (m.rank === "high") {
    drawAuraRing(m.x, m.y, m.r + 8, `rgba(108,240,255,${0.45 + 0.25 * pulse})`, 3);
  } else if (m.rank === "jackpot") {
    drawAuraRing(m.x, m.y, m.r + 12, `rgba(255,210,63,${0.55 + 0.35 * pulse})`, 4);
    drawAuraRing(m.x, m.y, m.r + 18, `rgba(255,120,240,${0.25 + 0.2 * pulse})`, 2);
  }
  ctx.beginPath();
  ctx.fillStyle = mat.color;
  ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
  ctx.fill();
}

function drawFloatingTexts(now) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i];
    const t = (now - f.bornAt) / f.lifeMs;
    if (t >= 1) { floatingTexts.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = f.color;
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(f.text, f.x, f.y - t * 20);
    ctx.globalAlpha = 1;
  }
}

// ======================================================================
// メインループ
// ======================================================================
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (phase === PHASE.COLLECT) {
    updateCollectPhase(dt, now);
    drawCollectPhase(now);
  }
  // PREP / COMBAT_STUB は canvas を止めて背景として残すだけ（HTMLオーバーレイが前面に出る）

  requestAnimationFrame(loop);
}

startCollectPhase();
requestAnimationFrame(loop);
</script>
</body>
</html>
